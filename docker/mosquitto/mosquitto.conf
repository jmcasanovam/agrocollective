# =============================================================
# Mosquitto MQTT Broker - AgroCollective
# =============================================================

# --- Listener ---
listener 1883
protocol mqtt

# --- Autenticación (anónima en desarrollo) ---
allow_anonymous true

# --- Persistencia (caché 24h para resiliencia) ---
persistence true
persistence_location /mosquitto/data/
persistent_client_expiration 24h

# --- Logging ---
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true

# --- Límites de conexión ---
max_connections 100
max_inflight_messages 20
max_queued_messages 200
