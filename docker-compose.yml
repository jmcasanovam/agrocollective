services:

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: dev
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}

    container_name: agro_frontend

    ports:
      - "3000:3000"

    env_file:
      - .env

    environment:
      APP_ENV: ${APP_ENV:-production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}

    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile

    container_name: agro_backend

    env_file:
      - .env

    environment:
      POSTGRES_HOST: postgres
      INFLUXDB_HOST: influxdb
      MQTT_HOST: mosquitto

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    depends_on:
      - postgres
      - influxdb
      - mosquitto

    command: >
      sh -c "
      if [ '$APP_ENV' = 'development' ];
      then
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload;
      else
        uvicorn app.main:app --host 0.0.0.0 --port 8000;
      fi
      "

  postgres:
    image: postgres:16

    container_name: agro_postgres

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  influxdb:
    image: influxdb:2.7

    container_name: agro_influxdb

    ports:
      - "8086:8086"

    volumes:
      - influxdb_data:/var/lib/influxdb2

    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_INIT_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD:-admin_password_123}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-agrocollective}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET_WEATHER:-agrocollective_siar}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-my-super-secret-influxdb-token-for-dev-123}

  mosquitto:
    image: eclipse-mosquitto:2

    container_name: agro_mqtt

    ports:
      - "1883:1883"

    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

volumes:
  postgres_data:
  influxdb_data:
  mosquitto_data:
  mosquitto_log: